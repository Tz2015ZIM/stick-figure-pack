<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pop-up Blocker</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="top">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l8 3.2v5.6c0 5-3.4 9.3-8 11.2-4.6-1.9-8-6.2-8-11.2V5.7z"/><path class="cut" d="M9.2 9.2l5.6 5.6M14.8 9.2l-5.6 5.6"/></svg>
    <div class="top-text">
      <h1>Pop-up Blocker</h1>
      <p id="total">Nothing blocked yet</p>
    </div>
    <label class="switch big" title="Turn every blocker on or off">
      <input type="checkbox" id="enabled">
      <span></span>
    </label>
  </header>

  <main>
    <section class="card site" id="site">
      <div class="site-row">
        <span class="dot" id="site-dot"></span>
        <div class="site-text">
          <div class="site-host" id="site-host">—</div>
          <div class="site-status" id="site-status"></div>
        </div>
        <div class="site-count" id="site-count" hidden><b>0</b><span>blocked here</span></div>
      </div>
      <p class="hint" id="site-hint" hidden></p>
      <div class="site-actions" id="site-actions">
        <button class="btn wide" id="allow-site"></button>
        <div class="tools">
          <button class="btn" id="remove-overlay" title="Remove the box covering the middle of the page">
            <svg viewBox="0 0 24 24"><rect x="3" y="7" width="12" height="12" rx="2"/><path d="M9 3h10a2 2 0 0 1 2 2v10"/><path d="M6.5 10.5l5 5M11.5 10.5l-5 5"/></svg>
            Remove overlay
          </button>
          <button class="btn" id="zap" title="Click things on the page to remove them">
            <svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>
            <span id="zap-label">Zap element</span>
          </button>
        </div>
        <p class="tool-status" id="tool-status" role="status"></p>
      </div>
    </section>

    <h2>Stickman</h2>
    <section class="card list stickman">
      <canvas id="stage" title="Click to give him a practice pop-up"></canvas>
      <label class="row">
        <span class="row-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="4.5" r="2.3"/><path d="M11 7v7.5M11 9.5l-4 2.5M11 9.5l4.5-1.5M11 14.5l-3 6.5M11 14.5l5.5-1.5 1 4"/></svg></span>
        <span class="row-text"><b>Stickman fighter</b><small>Your stickman runs onto the page, attacks pop-ups and ads, and smashes them. Right-click one and pick Destroy ad to send him at it; a video gets knocked to the end.</small></span>
        <span class="switch"><input type="checkbox" data-key="stickman"><span></span></span>
      </label>
      <label class="row sub" id="stickman-ads-row">
        <span class="row-icon"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M6.5 15l2-6 2 6M7.2 13.2h2.6M13.5 9v6h1.3a3 3 0 0 0 0-6z"/></svg></span>
        <span class="row-text"><b>Hunt ads too</b><small>He also goes after ad banners he spots while you scroll.</small></span>
        <span class="switch"><input type="checkbox" data-key="stickmanAds"><span></span></span>
      </label>
      <div class="stick-send">
        <button class="btn wide" id="send-stickman">
          <svg viewBox="0 0 24 24"><path d="M5 12h12M13 7l5 5-5 5"/></svg>
          Send stickman to this page
        </button>
        <p class="tool-status" id="stick-note"></p>
        <p class="tool-status" id="stick-status" role="status"></p>
      </div>
    </section>

    <h2>Blockers</h2>
    <section class="card list" id="blockers">
      <label class="row">
        <span class="row-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M12 12v5M9.5 14.5h5"/></svg></span>
        <span class="row-text"><b>Pop-up tabs &amp; windows</b><small>Stops sites opening tabs or windows you didn't click, including pop-unders and invisible ad links.</small></span>
        <span class="switch"><input type="checkbox" data-key="popups"><span></span></span>
      </label>
      <label class="row sub" id="sign-in-row">
        <span class="row-icon"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
        <span class="row-text"><b>Let sign-in pop-ups through</b><small>Google, Microsoft, Apple, Discord and other log-in windows.</small></span>
        <span class="switch"><input type="checkbox" data-key="signIn"><span></span></span>
      </label>
      <label class="row">
        <span class="row-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="7" y="8" width="10" height="8" rx="1.5"/></svg></span>
        <span class="row-text"><b>Covering pop-ups</b><small>Hides boxes that cover the page (newsletters, cookie walls, "turn off your ad blocker") and unlocks scrolling.</small></span>
        <span class="switch"><input type="checkbox" data-key="overlays"><span></span></span>
      </label>
      <label class="row">
        <span class="row-icon"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M12 8v3.5M12 13.8v.2"/></svg></span>
        <span class="row-text"><b>Alert boxes</b><small>Blocks alert, confirm and prompt boxes you didn't trigger yourself.</small></span>
        <span class="switch"><input type="checkbox" data-key="dialogs"><span></span></span>
      </label>
      <label class="row">
        <span class="row-icon"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg></span>
        <span class="row-text"><b>Notification requests</b><small>Silences "Show notifications?" prompts. Sites you already allowed keep working.</small></span>
        <span class="switch"><input type="checkbox" data-key="notifications"><span></span></span>
      </label>
      <label class="row">
        <span class="row-icon"><svg viewBox="0 0 24 24"><path d="M14 4h5v16h-5"/><path d="M4 12h11M11 8l4 4-4 4"/></svg></span>
        <span class="row-text"><b>"Leave site?" warnings</b><small>Stops pages trapping you when you close them. May also skip real unsaved-changes warnings.</small></span>
        <span class="switch"><input type="checkbox" data-key="leave"><span></span></span>
      </label>
      <label class="row">
        <span class="row-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="11" y="13" width="7" height="4" rx="1"/></svg></span>
        <span class="row-text"><b>Show a notice on the page</b><small>A small message in the corner when something is blocked, with Open and Allow buttons.</small></span>
        <span class="switch"><input type="checkbox" data-key="notices"><span></span></span>
      </label>
    </section>

    <div class="section-head">
      <h2>Recently blocked</h2>
      <button class="link-btn" id="clear-log" hidden>Clear</button>
    </div>
    <section class="card log" id="log"></section>

    <h2>Allowed sites</h2>
    <section class="card allowed" id="allowed"></section>
  </main>

  <script src="common.js"></script>
  <script src="stickman.js"></script>
  <script src="panel.js"></script>
</body>
</html>
